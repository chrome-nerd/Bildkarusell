
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bildkarusell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f8f8f8; }

    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background-color: #000;
      aspect-ratio: 16 / 9;
    }

    .carousel-slides {
      display: flex;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      flex-shrink: 0;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background-color: #000;
    }

    .carousel-nav {
      position: absolute;
      width: 100%;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 10px;
    }

    .carousel-nav button {
      background: rgba(0,0,0,0.4);
      color: white;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 50%;
    }

    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
    }

    .carousel-dot {
      height: 10px;
      width: 10px;
      margin: 0 4px;
      background-color: #ccc;
      border-radius: 50%;
      cursor: pointer;
    }

    .carousel-dot.active {
      background-color: #333;
    }

    @media (max-width: 600px) {
      .carousel-container {
        aspect-ratio: 4 / 3;
      }
      .carousel-nav button {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel-slides" id="slides">
      <div class="carousel-slide"><img src="https://i.imgur.com/iwQg3BW.jpeg" alt="Bild 1" /></div>
      <div class="carousel-slide"><img src="https://i.imgur.com/CG8OBPO.jpeg" alt="Bild 2" /></div>
      <div class="carousel-slide"><img src="https://i.imgur.com/UrBeCqU.jpeg" alt="Bild 3" /></div>
      <div class="carousel-slide"><img src="https://i.imgur.com/VcOKXtV.jpeg" alt="Bild 4" /></div>
    </div>

    <div class="carousel-nav">
      <button id="prev">&#10094;</button>
      <button id="next">&#10095;</button>
    </div>

    <div class="carousel-dots" id="dots"></div>
  </div>

  <script>
    const slides = document.getElementById("slides");
    const dotsContainer = document.getElementById("dots");
    const totalSlides = slides.children.length;
    let currentSlide = 0;
    let autoScrollInterval;

    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement("span");
      dot.classList.add("carousel-dot");
      if (i === 0) dot.classList.add("active");
      dot.addEventListener("click", () => {
        goToSlide(i);
        resetAutoScroll();
      });
      dotsContainer.appendChild(dot);
    }

    function updateDots() {
      document.querySelectorAll(".carousel-dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
      });
    }

    function goToSlide(index) {
      currentSlide = (index + totalSlides) % totalSlides;
      slides.style.transform = `translateX(-${currentSlide * 100}%)`;
      updateDots();
    }

    function nextSlide() {
      goToSlide(currentSlide + 1);
    }

    function prevSlide() {
      goToSlide(currentSlide - 1);
    }

    document.getElementById("next").addEventListener("click", () => {
      nextSlide();
      resetAutoScroll();
    });

    document.getElementById("prev").addEventListener("click", () => {
      prevSlide();
      resetAutoScroll();
    });

    function startAutoScroll() {
      autoScrollInterval = setInterval(nextSlide, 5000);
    }

    function resetAutoScroll() {
      clearInterval(autoScrollInterval);
      startAutoScroll();
    }

    let startX = 0;
    slides.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
    });
    slides.addEventListener("touchend", (e) => {
      const endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) {
        nextSlide();
        resetAutoScroll();
      } else if (endX - startX > 50) {
        prevSlide();
        resetAutoScroll();
      }
    });

    startAutoScroll();
  </script>

</body>
</html>
